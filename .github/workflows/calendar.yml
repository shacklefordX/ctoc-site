name: Build calendar feed
on:
  push:
    branches: [main]
    paths: ["data/workouts.json", "scripts/build_ics.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_ics.py
      - name: Commit calendar.ics if changed
        run: |
          git config user.name "ctoc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add calendar.ics
          git diff --cached --quiet || (git commit -m "Update calendar feed" && git push)
